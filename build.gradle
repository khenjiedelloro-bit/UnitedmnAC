plugins {
    id 'java'
}

group = 'com.example'
version = '1.0.0'
base { archivesName = 'unitednmAC' }

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.2.build.+'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}
